<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4FAE52" />
    <meta name="description" content="לצעוד לתוך היום: 12 צעדים, 12 חודשים, 24 שעות. התמדה יומיומית בדרך מסודרת." />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="לצעוד" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>לצעוד לתוך היום</title>
  </head>
  <body>
    <!-- מסך פתיחה: שתי עקבות נכנסות, עד שהאפליקציה עולה (App.tsx מסיר אותו). בלי סקריפט: CSP -->
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 300 300" width="132" height="132">
        <g class="sp-l"><path transform="translate(40 92) rotate(-8) scale(.92)" d="M60 0C96 0 118 30 118 74c0 38-14 64-18 86H20C16 138 2 112 2 74 2 30 24 0 60 0Z" /><rect transform="translate(40 92) rotate(-8) scale(.92)" x="18" y="174" width="84" height="66" rx="26" /></g>
        <g class="sp-r"><path transform="translate(168 14) rotate(8) scale(.92)" d="M60 0C96 0 118 30 118 74c0 38-14 64-18 86H20C16 138 2 112 2 74 2 30 24 0 60 0Z" /><rect transform="translate(168 14) rotate(8) scale(.92)" x="18" y="174" width="84" height="66" rx="26" /></g>
      </svg>
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #4fae52;
        transition: opacity 0.35s ease;
        /* אם משהו נתקע, המסך נעלם לבד */
        animation: sp-hide 0.3s 5s forwards;
      }
      #splash.out {
        opacity: 0;
        pointer-events: none;
      }
      #splash g {
        fill: #fff;
        transform-box: fill-box;
        transform-origin: center;
        animation: sp-step 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.3) backwards;
      }
      #splash .sp-l {
        opacity: 0.6;
        animation-delay: 0.05s;
      }
      #splash .sp-r {
        animation-delay: 0.32s;
      }
      @keyframes sp-step {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.9);
        }
      }
      @keyframes sp-hide {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #24622a;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash g {
          animation: none;
        }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
